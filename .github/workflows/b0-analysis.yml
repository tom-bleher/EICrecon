name: B0 analysis tests
on:
  pull_request:
    paths:
      - 'src/benchmarks/reconstruction/b0_telescope/**'
      - '.github/workflows/b0-analysis.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s src/benchmarks/reconstruction/b0_telescope -v
